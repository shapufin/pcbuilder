name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buildmyrig
          POSTGRES_PASSWORD: buildmyrig
          POSTGRES_DB: buildmyrig
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildmyrig"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URI: postgres://buildmyrig:buildmyrig@localhost:5432/buildmyrig
      PAYLOAD_SECRET: ci-secret-not-used-in-prod
      BMR_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Secret scan
        run: |
          if git grep -nEI "AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}|xox[baprs]-[A-Za-z0-9-]{10,}|sk-[A-Za-z0-9]{32,}|-----BEGIN [A-Z ]*PRIVATE KEY-----" -- . ':!pnpm-lock.yaml'; then
            echo "::error::Potential secret pattern found in tracked files"
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Push mode only runs on dev boots (documented workflow): boot next dev,
      # wait until the payload-backed /api/users/me answers (proves the schema
      # was pushed to the CI Postgres), then tear it down before pnpm build.
      - name: Push DB schema (dev boot against CI Postgres)
        run: |
          pnpm dev > dev-boot.log 2>&1 &
          ok=""
          for i in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/users/me > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::dev boot / schema push failed"
            tail -n 120 dev-boot.log
            exit 1
          fi
          echo "schema pushed ok"
          pkill -f "turbo dev" || true
          fuser -k 3000/tcp || true
          sleep 2
          # The dev boot also writes generated route types under .next, and
          # tsconfig includes .next/dev/types/**/*.ts — a SIGKILL
          # mid-generation leaves a partially written validator.ts that fails
          # the build's type check with TS1002 "Unterminated string literal"
          # (run 37193975900). Clear the dev artifacts so the build starts from
          # the same clean state as a fresh checkout; it regenerates its own
          # types before type checking.
          rm -rf apps/web/.next
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
