name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buildmyrig
          POSTGRES_PASSWORD: buildmyrig
          POSTGRES_DB: buildmyrig
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildmyrig"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URI: postgres://buildmyrig:buildmyrig@localhost:5432/buildmyrig
      PAYLOAD_SECRET: ci-secret-not-used-in-prod
      BMR_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Secret scan
        run: |
          if git grep -nEI "AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{82}|xox[baprs]-[A-Za-z0-9-]{10,}|sk-[A-Za-z0-9]{32,}|-----BEGIN [A-Z ]*PRIVATE KEY-----" -- . ':!pnpm-lock.yaml'; then
            echo "::error::Potential secret pattern found in tracked files"
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
