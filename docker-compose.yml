# Local dev databases (Postgres for parity with production; SQLite fallback needs no Docker)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buildmyrig
      POSTGRES_PASSWORD: buildmyrig
      POSTGRES_DB: buildmyrig
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildmyrig"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
