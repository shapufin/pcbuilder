packages:
  - "apps/*"
  - "packages/*"
overrides:
  esbuild@0.18.20: "0.25.12"
  undici: "^7.29.1"
auditConfig:
  # braces<=3.0.3 (GHSA-vfj7-8cjw-p6xm): no patched release; reachable only
  # via chokidar/fast-glob build-time globbing with project-controlled
  # patterns — not user input at runtime. Revisit on next dep round.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
onlyBuiltDependencies:
  - sharp
  - esbuild
  - '@swc/core'
  - argon2
  - bcrypt
  - unrs-resolver
dangerouslyAllowAllBuilds: true
patchedDependencies:
  '@payloadcms/plugin-ecommerce@3.90.2': patches/@payloadcms__plugin-ecommerce@3.90.2.patch
